name: Deploy MkDocs site

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mkdocs-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            mkdocs-

      # Social cards (docs/index.md, each theme's Overview page, etc. via
      # the `social` plugin) are rendered with cairosvg, which needs these
      # system libraries — not just the Python packages in requirements.txt.
      - name: Install system dependencies for social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      # Caches both the rendered card PNGs and the webfonts the social
      # plugin downloads from Google Fonts on first use — without this,
      # every deploy re-fetches fonts and re-renders every card from
      # scratch. Keyed per-commit so a cache always saves; restore-keys
      # falls back to the most recent prior cache either way.
      - name: Cache social card assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: social-cards-${{ github.sha }}
          restore-keys: |
            social-cards-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      # Regression guard: both galleries' markdown="1" raw-HTML block must
      # actually compile its images into real <img> tags. This exact
      # pattern silently broke once already (a Markdown/md_in_html version
      # swallowed every image's content, leaving 82 empty <p></p> tags
      # with no error from `mkdocs build --strict`) and shipped to every
      # visitor before anyone noticed, so this fails the build loudly
      # instead of deploying a gallery page with zero images on it again.
      - name: Verify galleries actually contain images
        run: |
          for f in site/f1-2025-theme/gallery/index.html site/f1-2026-theme/gallery/index.html; do
            count=$(grep -o "<img[^>]*>" "$f" | wc -l)
            echo "$f: $count img tags"
            if [ "$count" -eq 0 ]; then
              echo "::error::$f has no <img> tags - gallery markdown failed to compile, aborting deploy"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
