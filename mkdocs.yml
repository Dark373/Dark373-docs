site_name: Dark373 Docs
site_description: Documentation for Racing League Tool (RLT) Flex Renderer theme/layout projects
site_url: https://dark373.github.io/Dark373-docs/
repo_name: Dark373/Dark373-docs
repo_url: https://github.com/Dark373/Dark373-docs
copyright: Site built by Solar

theme:
  name: material
  custom_dir: overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Titillium Web
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra:
  # Cache-buster appended to every social card image URL (see
  # layouts/default.yml) - bump this any time the card's look changes, so
  # Discord/Twitter/etc. can't keep serving a stale cached image for what
  # looks like the same URL.
  card_version: "3"

extra_css:
  - stylesheets/extra.css?v=3

extra_javascript:
  - javascripts/racing.js?v=3

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#ff1947"
        color: "#ffffff"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs/includes]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - 2025:
      - Overview: f1-2025-theme/index.md
      - FAQ: f1-2025-theme/faq.md
      - Installation:
          - Installing: f1-2025-theme/installation.md
          - Setup: f1-2025-theme/theme-options.md
      - App Render Locations: f1-2025-theme/app-render-locations.md
      - Gallery: f1-2025-theme/gallery.md
      - Changelog: f1-2025-theme/changelog.md
      - Known Limitations: f1-2025-theme/known-bugs.md
  - 2026:
      - Overview: f1-2026-theme/index.md
      - FAQ: f1-2026-theme/faq.md
      - Installation:
          - Installing: f1-2026-theme/installation.md
          - Setup: f1-2026-theme/theme-options.md
      - App Render Locations: f1-2026-theme/app-render-locations.md
      - Gallery: f1-2026-theme/gallery.md
      - Changelog: f1-2026-theme/changelog.md
      - Known Limitations: f1-2026-theme/known-bugs.md
  - 2027:
      - Overview: 2027/index.md
      - FAQ: 2027/faq.md
      - Installation:
          - Installing: 2027/installation.md
      - App Render Locations: 2027/app-render-locations.md
  - Commissions: commissions/index.md
  - Terms & Policies: policies.md
