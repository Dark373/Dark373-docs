# Overrides the "social" plugin's built-in default.yml (this file is found
# first because cards_layout_dir defaults to "layouts", and this repo's
# layouts/default.yml sits right there). Same as the stock layout, except
# the single background layer is split into two: solid colour first, then
# the theme's own halftone-dot texture layered on top as a semi-transparent
# overlay (docs/assets/images/social-card-texture.png), instead of the
# stock behaviour where a background_image and background_color live in the
# same layer and the color paints over the image, hiding it.

# Definitions
definitions:

  # Background color (default: indigo)
  - &background_color >-
    {%- if layout.background_color -%}
      {{ layout.background_color }}
    {%- else -%}
      {%- set palette = config.theme.palette or {} -%}
      {%- if not palette is mapping -%}
        {%- set list = palette | selectattr("primary") | list + palette -%}
        {%- set palette = list | first -%}
      {%- endif -%}
      {%- set primary = palette.get("primary", "indigo") -%}
      {%- set primary = primary.replace(" ", "-") -%}
      {{ {
        "red":         "#ef5552",
        "pink":        "#e92063",
        "purple":      "#ab47bd",
        "deep-purple": "#7e56c2",
        "indigo":      "#4051b5",
        "blue":        "#2094f3",
        "light-blue":  "#02a6f2",
        "cyan":        "#00bdd6",
        "teal":        "#009485",
        "green":       "#4cae4f",
        "light-green": "#8bc34b",
        "lime":        "#cbdc38",
        "yellow":      "#ffec3d",
        "amber":       "#ffc105",
        "orange":      "#ffa724",
        "deep-orange": "#ff6e42",
        "brown":       "#795649",
        "grey":        "#757575",
        "blue-grey":   "#546d78",
        "black":       "#000000",
        "white":       "#ffffff"
      }[primary] or "#4051b5" }}
    {%- endif -%}

  # Texture overlay, sits on top of the solid background colour - a
  # pre-tinted (shade of that page's own accent, not black) and
  # pre-shifted-right variant, picked per page via cards_layout_options.
  # texture_image; falls back to the red/homepage variant if unset.
  - &texture_image >-
    {%- if layout.texture_image -%}
      {{ config.docs_dir }}/assets/images/social-card-texture/{{ layout.texture_image }}.webp
    {%- else -%}
      {{ config.docs_dir }}/assets/images/social-card-texture/red.webp
    {%- endif -%}

  # Text color (default: white)
  - &color >-
    {%- if layout.color -%}
      {{ layout.color }}
    {%- else -%}
      {%- set palette = config.theme.palette or {} -%}
      {%- if not palette is mapping -%}
        {%- set list = palette | selectattr("primary") | list + palette -%}
        {%- set palette = list | first -%}
      {%- endif -%}
      {%- set primary = palette.get("primary", "indigo") -%}
      {%- set primary = primary.replace(" ", "-") -%}
      {{ {
        "red":         "#ffffff",
        "pink":        "#ffffff",
        "purple":      "#ffffff",
        "deep-purple": "#ffffff",
        "indigo":      "#ffffff",
        "blue":        "#ffffff",
        "light-blue":  "#ffffff",
        "cyan":        "#ffffff",
        "teal":        "#ffffff",
        "green":       "#ffffff",
        "light-green": "#ffffff",
        "lime":        "#000000",
        "yellow":      "#000000",
        "amber":       "#000000",
        "orange":      "#000000",
        "deep-orange": "#ffffff",
        "brown":       "#ffffff",
        "grey":        "#ffffff",
        "blue-grey":   "#ffffff",
        "black":       "#ffffff",
        "white":       "#000000"
      }[primary] or "#ffffff" }}
    {%- endif -%}

  # Font family (default: Roboto)
  - &font_family >-
    {%- if layout.font_family -%}
      {{ layout.font_family }}
    {%- elif config.theme.font is mapping -%}
      {{ config.theme.font.get("text", "Roboto") }}
    {%- else -%}
      Roboto
    {%- endif -%}

  # Font variant
  - &font_variant >-
    {%- if layout.font_variant -%}
      {{ layout.font_variant }}
    {%- endif -%}

  # Site name
  - &site_name >-
    {{ config.site_name }}

  # Page title
  - &page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) }}
    {%- endif -%}

  # Page title with site name
  - &page_title_with_site_name >-
    {%- if not page.is_homepage -%}
      {{ page.meta.get("title", page.title) }} - {{ config.site_name }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}

  # Page description
  - &page_description >-
    {%- if layout.description -%}
      {{ layout.description }}
    {%- else -%}
      {{ page.meta.get("description", config.site_description) | x }}
    {%- endif -%}

  # Logo
  - &logo >-
    {%- if layout.logo -%}
      {{ layout.logo }}
    {%- elif config.theme.logo -%}
      {{ config.docs_dir }}/{{ config.theme.logo }}
    {%- endif -%}

  # Logo (icon)
  - &logo_icon >-
    {%- if not layout.logo and config.theme.icon -%}
      {{ config.theme.icon.logo | x }}
    {%- endif -%}

# Meta tags. og:image/twitter:image carry a ?v= cache-buster off
# extra.card_version (mkdocs.yml) - Discord (and others) cache the fetched
# image by its own URL, separately from the page, and that URL is otherwise
# identical on every deploy since it's just the page path. Re-crawling the
# page alone (e.g. sharing it with a dummy ?query on the page URL) doesn't
# help - the image URL inside is unchanged, so the stale cached image gets
# served again. Bump card_version whenever the card's look changes and it
# becomes a genuinely new URL.
tags:

  # Open Graph
  og:type: website
  og:title: *page_title_with_site_name
  og:description: *page_description
  og:image: "{{ image.url }}?v={{ config.extra.card_version | default('1') }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  # Twitter
  twitter:card: summary_large_image
  twitter:title: *page_title_with_site_name
  twitter:description: *page_description
  twitter:image: "{{ image.url }}?v={{ config.extra.card_version | default('1') }}"

# -----------------------------------------------------------------------------
# Specification
# -----------------------------------------------------------------------------

# Card size and layers
size: { width: 1200, height: 630 }
layers:

  # Background: solid colour first
  - background:
      color: *background_color

  # Background: dot texture on top, semi-transparent so the colour shows
  # through
  - background:
      image: *texture_image

  # Logo
  - size: { width: 144, height: 144 }
    offset: { x: 992, y: 64 }
    background:
      image: *logo
    icon:
      value: *logo_icon
      color: *color

  # Site name
  - size: { width: 832, height: 42 }
    offset: { x: 64, y: 64 }
    typography:
      content: *site_name
      color: *color
      font:
        family: *font_family
        variant: *font_variant
        style: Bold

  # Page title
  - size: { width: 832, height: 310 }
    offset: { x: 62, y: 160 }
    typography:
      content: *page_title
      align: start
      color: *color
      line:
        amount: 3
        height: 1.25
      font:
        family: *font_family
        variant: *font_variant
        style: Bold

  # Page description
  - size: { width: 832, height: 64 }
    offset: { x: 64, y: 512 }
    typography:
      content: *page_description
      align: start
      color: *color
      line:
        amount: 2
        height: 1.5
      font:
        family: *font_family
        variant: *font_variant
        style: Regular
